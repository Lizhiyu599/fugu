<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>French Retro Desktop</title>

  <!-- 1. 全局变量 -->
  <link rel="stylesheet" href="css/variables.css">
  <!-- 2. 基础布局与壁纸 -->
  <link rel="stylesheet" href="css/base.css">
  <!-- 3. UI 组件样式 -->
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- 全屏桌面画布 -->
  <main class="desktop-container" id="desktop">
    
    <!-- 桌面小组件放置区 -->
    <div class="widgets-area" id="widgets-area">
      
      <!-- 2x4 高透玻璃双头像小组件（扁平加宽版） -->
      <div class="widget-2x4-avatars">
        
        <div class="avatars-group">
          <!-- 左头像组 -->
          <div class="avatar-box">
            <div class="avatar-frame" onclick="triggerAvatarUpload('left-avatar-input')">
              <!-- 空白占位 SVG 符号 -->
              <svg id="left-placeholder" class="avatar-placeholder-icon" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
              </svg>
              <img id="avatar-left-img" class="avatar-img" src="" alt="User Avatar">
            </div>
            <!-- 可编辑名字（contenteditable允许直接点击编辑） -->
            <span class="avatar-name" contenteditable="true" spellcheck="false">Moi</span>
            <input type="file" id="left-avatar-input" accept="image/*" style="display: none;" onchange="handleAvatarChange(event, 'avatar-left-img', 'left-placeholder')">
          </div>

          <!-- 中间紧凑分隔符 -->
          <div class="avatar-divider-icon">✦</div>

          <!-- 右头像组 -->
          <div class="avatar-box">
            <div class="avatar-frame" onclick="triggerAvatarUpload('right-avatar-input')">
              <!-- 空白占位 SVG 符号 -->
              <svg id="right-placeholder" class="avatar-placeholder-icon" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
              </svg>
              <img id="avatar-right-img" class="avatar-img" src="" alt="AI Avatar">
            </div>
            <!-- 可编辑名字 -->
            <span class="avatar-name" contenteditable="true" spellcheck="false">Mon Amour</span>
            <input type="file" id="right-avatar-input" accept="image/*" style="display: none;" onchange="handleAvatarChange(event, 'avatar-right-img', 'right-placeholder')">
          </div>
        </div>

      </div>

    </div>

    <!-- 底层固定结构：高透玻璃 Dock 栏 -->
    <div class="dock-wrapper">
      <div class="glass-dock" id="main-dock">
        <!-- 预留 App 图标 -->
      </div>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
