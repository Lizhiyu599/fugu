<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Glass Desktop</title>
  
  <!-- 引入模块化样式文件 -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- 全屏桌面画布 -->
  <main class="desktop-container" id="desktop">
    
    <!-- 顶部/中间区域预留给后续的大量高透玻璃小组件 -->
    <div class="widgets-area" id="widgets-area">
      <!-- 后面我们在这里一步步添加各种精美小组件 -->
    </div>

    <!-- 底层固定结构：高透玻璃 Dock 栏 -->
    <div class="dock-wrapper">
      <div class="glass-dock" id="main-dock">
        <!-- 预留给后续的 App 图标（如：酒馆、人设、设置等） -->
      </div>
    </div>

  </main>

  <!-- 入口脚本 -->
  <script src="js/main.js"></script>
</body>
</html>
