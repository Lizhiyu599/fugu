<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>French Retro Desktop</title>

  <!-- 全局通用样式 -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- 注册登录弹窗样式 -->
  <link rel="stylesheet" href="css/auth.css">

  <!-- 独立应用 CSS -->
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/embellir.css">
</head>
<body>

  <!-- 全屏桌面画布 -->
  <main class="desktop-container" id="desktop">
    
    <!-- 桌面顶部常驻纯净信息栏 -->
    <div class="top-info-bar" id="top-info-bar">
      <div class="top-info-left">
        <span class="info-time-text" id="info-time-text">00:00</span>
      </div>
      <div class="top-info-right">
        <div class="battery-wrapper">
          <span class="battery-text" id="info-battery-level">100%</span>
          <svg class="battery-icon-svg" viewBox="0 0 24 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="19" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <!-- 动态绘制填充条（最大宽度 13.5px） -->
            <rect id="info-battery-fill" x="3" y="3" width="13.5" height="6" rx="1" fill="currentColor"/>
            <path d="M22 4V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- 桌面网格区 -->
    <div class="widgets-area" id="widgets-area" style="padding-top: 36px;">
      <!-- 2x4 高透玻璃双头像小组件 -->
      <div class="widget-2x4-avatars">
        <div class="avatars-group">
          <div class="avatar-box">
            <div class="avatar-frame" id="left-avatar-frame" onclick="triggerAvatarUpload('left-avatar-input')">
              <span class="avatar-plus" id="left-plus">+</span>
            </div>
            <span class="avatar-name" contenteditable="true" spellcheck="false">Moi</span>
            <input type="file" id="left-avatar-input" accept="image/*" style="display: none;" onchange="handleAvatarChange(event, 'left-avatar-frame', 'left-plus')">
          </div>

          <div class="avatar-box">
            <div class="avatar-frame" id="right-avatar-frame" onclick="triggerAvatarUpload('right-avatar-input')">
              <span class="avatar-plus" id="right-plus">+</span>
            </div>
            <span class="avatar-name" contenteditable="true" spellcheck="false">Mon Amour</span>
            <input type="file" id="right-avatar-input" accept="image/*" style="display: none;" onchange="handleAvatarChange(event, 'right-avatar-frame', 'right-plus')">
          </div>
        </div>
      </div>
    </div>

    <!-- 底部 Dock 栏 -->
    <div class="dock-wrapper">
      <div class="glass-dock" id="main-dock">
        <!-- Embellir 美化应用图标（严格约束在 26px） -->
        <div class="dock-item" onclick="AppManager.launch('embellir')" title="Embellir">
          <svg class="dock-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <span class="dock-label">Embellir</span>
        </div>

        <!-- Réglages 设置应用图标 -->
        <div class="dock-item" onclick="AppManager.launch('settings')" title="Réglages / Outil">
          <svg class="dock-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z"/>
            <path d="M19.4 15A1.65 1.65 0 0 0 20 12A1.65 1.65 0 0 0 19.4 9M4.6 9A1.65 1.65 0 0 0 4 12A1.65 1.65 0 0 0 4.6 15M15 19.4A1.65 1.65 0 0 0 12 20A1.65 1.65 0 0 0 9 19.4M9 4.6A1.65 1.65 0 0 0 15 4.6"/>
            <path d="M19.4 15L21 16.5M19.4 9L21 7.5M4.6 9L3 7.5M4.6 15L3 16.5M15 19.4L16.5 21M9 19.4L7.5 21M9 4.6L7.5 3M15 4.6L16.5 3"/>
          </svg>
          <span class="dock-label">Outil</span>
        </div>
      </div>
    </div>

  </main>

  <!-- 账号认证系统 -->
  <script src="js/auth.js"></script>

  <!-- 基础全局配置与桌面持久化 -->
  <script src="js/main.js"></script>

  <!-- 应用统一调度中心 -->
  <script src="js/apps.js"></script>

  <!-- 独立应用脚本列表 -->
  <script src="js/settings.js"></script>
  <script src="js/embellir.js"></script>
</body>
</html>
