<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Retro Device</title>
  <!-- 引入法式古典衬线字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    /* CSS 全局变量：法式复古调色盘 */
    :root {
      --bg-paper: #dabe9b;
      --paper-texture: #c3a27a;
      --ink-black: #2b2622;
      --brass-gold: #b38b4d;
      --brass-dark: #6e5223;
      --burgundy: #6b2d2d;
      --forest-green: #2d4a3e;
      --paper-shadow: inset 0 0 50px rgba(74, 52, 28, 0.3);
      --font-serif: 'Cormorant Garamond', 'Times New Roman', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #1a1816;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: var(--font-serif);
      color: var(--ink-black);
    }

    /* 手机外壳容器 */
    .device-body {
      width: 380px;
      height: 760px;
      background: #3a322b;
      border-radius: 40px;
      padding: 18px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8),
                  inset 0 2px 5px rgba(255, 255, 255, 0.2),
                  inset 0 -2px 5px rgba(0, 0, 0, 0.8);
      position: relative;
      border: 2px solid #574a3e;
    }

    /* 屏幕区域（牛皮纸质感） */
    .screen {
      width: 100%;
      height: 100%;
      background-color: var(--bg-paper);
      /* 纯 CSS 模拟牛皮纸纤维颗粒感 */
      background-image: 
        radial-gradient(var(--paper-texture) 15%, transparent 16%),
        radial-gradient(var(--paper-texture) 15%, transparent 16%);
      background-size: 6px 6px;
      background-position: 0 0, 3px 3px;
      border-radius: 26px;
      box-shadow: var(--paper-shadow);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--brass-dark);
    }

    /* 顶部状态栏 */
    .status-bar {
      height: 35px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      border-bottom: 1px dashed rgba(43, 38, 34, 0.2);
    }

    .status-bar .battery {
      border: 1px solid var(--ink-black);
      padding: 1px 4px;
      border-radius: 2px;
      font-size: 11px;
    }

    /* 桌面主体内容区 */
    .desktop-content {
      flex: 1;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    /* 复古小组件：诗歌/时间日历牌 */
    .widget-calendar {
      background: rgba(244, 233, 215, 0.6);
      border: 1px solid var(--brass-gold);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.08);
      position: relative;
      text-align: center;
    }

    .widget-calendar::before {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px dashed rgba(179, 139, 77, 0.5);
      pointer-events: none;
    }

    .widget-date {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--burgundy);
    }

    .widget-time {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 600;
      line-height: 1.1;
      margin: 5px 0;
    }

    .widget-quote {
      font-style: italic;
      font-size: 13px;
      opacity: 0.8;
      margin-top: 5px;
    }

    /* 应用网格 */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px 10px;
      margin-top: 10px;
    }

    /* 单个 App 项 */
    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .app-item:active {
      transform: scale(0.92);
    }

    /* 拟物复古图标容器 */
    .app-icon {
      width: 54px;
      height: 54px;
      background: #f4e9d7;
      border: 1.5px solid var(--ink-black);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 3px 3px 0px var(--ink-black);
      position: relative;
    }

    /* SVG 图标墨水风 */
    .app-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--ink-black);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-label {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-black);
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* 底部 Dock 栏 */
    .dock-bar {
      height: 75px;
      margin: 0 10px 10px 10px;
      background: rgba(220, 195, 160, 0.4);
      border: 1px solid var(--brass-gold);
      border-radius: 18px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      backdrop-filter: blur(2px);
    }

    /* 应用视图遮罩（打开 App 时的全屏窗口） */
    .app-viewport {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-paper);
      z-index: 100;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: var(--paper-shadow);
    }

    .app-viewport.active {
      transform: translateY(0);
    }

    .app-header {
      height: 50px;
      border-bottom: 1px solid var(--ink-black);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    .back-btn {
      background: none;
      border: none;
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: bold;
      color: var(--burgundy);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 手机实体外壳 -->
  <div class="device-body">
    <!-- 屏幕内容 -->
    <div class="screen">
      
      <!-- 状态栏 -->
      <div class="status-bar">
        <span class="location">Paris</span>
        <span class="battery">98%</span>
      </div>

      <!-- 桌面内容区 -->
      <div class="desktop-content">
        
        <!-- 日历小组件 -->
        <div class="widget-calendar">
          <div class="widget-date" id="widget-date">SEPTEMBRE 24</div>
          <div class="widget-time" id="widget-time">20:17</div>
          <div class="widget-quote">“ Le temps spent avec toi... ”</div>
        </div>

        <!-- 主桌面应用网格 -->
        <div class="app-grid">
          
          <!-- 应用 1：酒馆 / 聊天 -->
          <div class="app-item" onclick="openApp('Salon de Conversation')">
            <div class="app-icon">
              <!-- 手绘羽毛笔/书信 SVG -->
              <svg viewBox="0 0 24 24">
                <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18"></path>
                <path d="M2 2l7.5 7.5"></path>
              </svg>
            </div>
            <div class="app-label">Le Salon</div>
          </div>

          <!-- 应用 2：人设编辑器 -->
          <div class="app-item" onclick="openApp('Atelier Persona')">
            <div class="app-icon">
              <!-- 手绘剪影/面具 SVG -->
              <svg viewBox="0 0 24 24">
                <path d="M12 2a5 5 0 0 0-5 5v3a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5z"></path>
                <path d="M19 11v1a7 7 0 0 1-14 0v-1"></path>
                <path d="M8 21h8"></path>
                <path d="M12 17v4"></path>
              </svg>
            </div>
            <div class="app-label">Persona</div>
          </div>

          <!-- 应用 3：记忆画廊 -->
          <div class="app-item" onclick="openApp('Galerie')">
            <div class="app-icon">
              <!-- 手绘相框 SVG -->
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <path d="M21 15l-5-5L5 21"></path>
              </svg>
            </div>
            <div class="app-label">Galerie</div>
          </div>

          <!-- 应用 4：设置 / API接入 -->
          <div class="app-item" onclick="openApp('Réglages')">
            <div class="app-icon">
              <!-- 手绘罗盘/齿轮 SVG -->
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path>
              </svg>
            </div>
            <div class="app-label">Réglages</div>
          </div>

        </div>
      </div>

      <!-- 底部 Dock 栏 -->
      <div class="dock-bar">
        <div class="app-item" onclick="openApp('Journal')">
          <div class="app-icon" style="border-radius: 50%;">
            <svg viewBox="0 0 24 24">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
          </div>
        </div>
        <div class="app-item" onclick="openApp('Musique')">
          <div class="app-icon" style="border-radius: 50%;">
            <svg viewBox="0 0 24 24">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
          </div>
        </div>
      </div>

      <!-- APP 视图容器（动态加载软件内容预留） -->
      <div class="app-viewport" id="app-viewport">
        <div class="app-header">
          <button class="back-btn" onclick="closeApp()">‹ Retour</button>
          <span id="app-title" style="font-weight: bold;">App</span>
          <span style="width: 40px;"></span>
        </div>
        <div id="app-body" style="padding: 20px; flex: 1;">
          <!-- 软件具体界面将来插入这里 -->
        </div>
      </div>

    </div>
  </div>

  <script>
    // 更新时钟
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('widget-time').textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 打开 APP 逻辑
    function openApp(title) {
      document.getElementById('app-title').textContent = title;
      document.getElementById('app-body').innerHTML = `
        <div style="text-align: center; margin-top: 50px;">
          <h3 style="font-size: 20px; margin-bottom: 10px;">${title}</h3>
          <p style="font-style: italic; opacity: 0.7;">应用模块准备中...</p>
        </div>
      `;
      document.getElementById('app-viewport').classList.add('active');
    }

    // 关闭 APP
    function closeApp() {
      document.getElementById('app-viewport').classList.remove('active');
    }
  </script>
</body>
</html>
